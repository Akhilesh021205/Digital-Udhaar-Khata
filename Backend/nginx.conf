# Nginx configuration template for AWS EC2 Backend proxying
# Place this at /etc/nginx/sites-available/digital-udhaar and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain-or-ec2-ip; # Replace with your EC2 Elastic IP or domain name

    # Increase body size limit for image uploads/backups if needed
    client_max_body_size 10M;

    # Backend API requests
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO Real-time WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
