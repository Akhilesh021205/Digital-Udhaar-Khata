<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts: Plus Jakarta Sans, Caveat, Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700;850&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="description" content="AI Digital Khata - A modern digital ledger for Kirana stores to manage customer credit, send payment reminders, and generate statements." />
    <title>AI Digital Khata — Digital Khata for Kirana Stores</title>
    <!-- Preconnect to Backend API Server for instant DNS and TLS handshake -->
    <link rel="preconnect" href="https://digital-udhaar-khata.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://digital-udhaar-khata.onrender.com">
    <!-- Non-blocking background backend wake-up ping -->
    <script>
      (function() {
        try {
          if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            fetch('https://digital-udhaar-khata.onrender.com/api/health', { mode: 'cors', cache: 'no-store' }).catch(function(){});
          }
        } catch(e){}
      })();
    </script>
    <!-- Cashfree & Razorpay Web SDKs (deferred to prevent render blocking) -->
    <script defer src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
